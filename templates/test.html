{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Language Detection</title>

    <!-- Favicons -->
    <link href="{% static 'assets/img/sign.jpg' %}" rel="icon">
    <link href="{% static 'assets/img/apple-touch-icon.png' %}" rel="apple-touch-icon">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,700,700i|Roboto:100,300,400,500,700|Philosopher:400,400i,700,700i"
        rel="stylesheet">

    <!-- Vendor CSS -->
    <link href="{% static 'assets/vendor/aos/aos.css' %}" rel="stylesheet">
    <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'assets/vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
    <link href="{% static 'assets/vendor/glightbox/css/glightbox.min.css' %}" rel="stylesheet">
    <link href="{% static 'assets/vendor/swiper/swiper-bundle.min.css' %}" rel="stylesheet">

    <!-- Main CSS -->
    <link href="{% static 'assets/css/style.css' %}" rel="stylesheet">

    <style>

        /* =========================
           SIGN LANGUAGE DETECTION
           ========================= */

        body {
            font-family: "Open Sans", sans-serif;
            background: #fff;
        }

        .detection-section {
            padding: 80px 0 60px 0;
            margin-top: 40px;
        }

        .detection-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .detection-title h2 {
            font-family: "Roboto", sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .detection-title p {
            color: #777;
            font-size: 16px;
        }

        /* Main detection area */

        .detection-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Camera */

        .camera-box {
            width: 640px;
            max-width: 90vw;
            margin: 0 auto 25px auto;
        }

        #videoElement {
            width: 640px;
            height: 480px;
            max-width: 100%;
            border: 3px solid #71c55d;
            border-radius: 8px;
            background-color: #888;
            object-fit: cover;
            display: block;
        }

        /* Start / Stop buttons */

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .control-button {
            background-color: #71c55d;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 11px 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .control-button:hover {
            background-color: #89e373;
            color: white;
        }

        .stop-button {
            background-color: #71c55d;
        }

        /* Output area */

        .output-area {
            width: 640px;
            max-width: 90vw;
            margin: 0 auto;
        }

        .output-title {
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .screen {
            width: 100%;
            min-height: 100px;
            border: 3px solid #71c55d;
            border-radius: 8px;
            background-color: #111;
            color: #71c55d;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            word-break: break-word;
            margin-bottom: 20px;
        }

        /* Screen control buttons */

        .button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .screen-button {
            background-color: #71c55d;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .screen-button:hover {
            background-color: #89e373;
        }

        .delete {
            background-color: red;
        }

        .delete:hover {
            background-color: #ff4444;
        }

        /* Bottom navigation */

        .link {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 40px;
        }

        .link ul {
            display: inline-flex;
            list-style: none;
            padding: 0;
            margin: 0;
            gap: 10px;
        }

        .link ul li {
            background: gray;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .link ul li:hover {
            background: #71c55d;
        }

        .link ul li a {
            color: white;
            text-decoration: none;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* =========================
           RESPONSIVE DESIGN
           ========================= */

        @media (max-width: 767px) {

            .detection-section {
                padding-top: 50px;
            }

            .detection-title h2 {
                font-size: 28px;
            }

            #videoElement {
                height: auto;
                min-height: 250px;
            }

            .controls {
                flex-direction: column;
            }

            .control-button {
                width: 180px;
            }

            .screen {
                font-size: 24px;
                min-height: 80px;
            }
        }

    </style>

</head>


<body>

    <!-- =========================
         HEADER
         ========================= -->

    <header id="header" class="header fixed-top d-flex align-items-center">

        <div class="container d-flex align-items-center justify-content-between">

            <div id="logo">

                <img
                    src="{% static 'images/logoo.png' %}"
                    style="width:50px;height:50px;"
                    alt="American Sign Language Logo"
                >

                <h1 style="color:#71c55d;">
                    American SignLanguage
                </h1>

            </div>

        </div>

    </header>


    <!-- =========================
         DETECTION SECTION
         ========================= -->

    <section class="detection-section">

        <div class="container">

            <!-- Title -->

            <div class="detection-title">

                <h2>Sign Language Detection</h2>

                <p>
                    Use your camera to detect American Sign Language gestures
                </p>

            </div>


            <!-- Detection Wrapper -->

            <div class="detection-wrapper">


                <!-- =========================
                     CAMERA
                     ========================= -->

                <div class="camera-box">

                    <video
                        id="videoElement"
                        autoplay
                        playsinline
                    ></video>

                </div>


                <!-- =========================
                     CAMERA CONTROLS
                     ========================= -->

                <div class="controls">

                    <button
                        id="startButton"
                        class="control-button"
                    >
                        Start Capture
                    </button>

                    <button
                        id="stopButton"
                        class="control-button stop-button"
                    >
                        Stop Capture
                    </button>

                </div>


                <!-- =========================
                     OUTPUT
                     ========================= -->

                <div class="output-area">

                    <div class="output-title">
                        Detected Sign
                    </div>

                    <div class="screen"></div>


                    <!-- =========================
                         OUTPUT CONTROLS
                         ========================= -->

                    <div class="button-container">

                        <button
                            class="screen-button delete"
                            onclick="deleteLastLetter()"
                        >
                            X
                        </button>

                        <button
                            class="screen-button"
                            onclick="addSpace()"
                        >
                            Space
                        </button>

                        <button
                            class="screen-button"
                            onclick="clearScreen()"
                        >
                            Clear Screen
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- =========================
         BOTTOM NAVIGATION
         ========================= -->

    <div class="link">

        <ul>

            <li>
                <a href="{% url 'home' %}">
                    I
                </a>
            </li>

            <li>
                <a href="{% url 'alphabets' %}">
                    H
                </a>
            </li>

            <li>
                <a href="{% url 'tutorials' %}">
                    T
                </a>
            </li>

        </ul>

    </div>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>

        /* =========================
           CSRF TOKEN
           ========================= */

        function getCookie(name) {

            var cookieValue = null;

            if (document.cookie && document.cookie !== '') {

                var cookies = document.cookie.split(';');

                for (var i = 0; i < cookies.length; i++) {

                    var cookie = cookies[i].trim();

                    if (
                        cookie.substring(0, name.length + 1)
                        === (name + '=')
                    ) {

                        cookieValue =
                            decodeURIComponent(
                                cookie.substring(name.length + 1)
                            );

                        break;
                    }
                }
            }

            return cookieValue;
        }


        /* =========================
           ELEMENTS
           ========================= */

        const videoElement =
            document.getElementById('videoElement');

        const startButton =
            document.getElementById('startButton');

        const stopButton =
            document.getElementById('stopButton');


        /* =========================
           VARIABLES
           ========================= */

        let stream;

        let intervalId;

        let lastDetectedGesture = '';

        let detectedWord = '';


        /* =========================
           BUTTON EVENTS
           ========================= */

        startButton.addEventListener(
            'click',
            startCapture
        );

        stopButton.addEventListener(
            'click',
            stopCapture
        );


        /* =========================
           START CAMERA
           ========================= */

        async function startCapture() {

            try {

                stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: true
                    });

                videoElement.srcObject = stream;

                intervalId =
                    setInterval(
                        captureAndSendFrame,
                        200
                    );

            } catch (err) {

                console.error(
                    'Error accessing camera:',
                    err
                );

                alert(
                    'Unable to access camera. Please allow camera permission.'
                );
            }
        }


        /* =========================
           STOP CAMERA
           ========================= */

        function stopCapture() {

            if (stream) {

                const tracks =
                    stream.getTracks();

                tracks.forEach(
                    track => track.stop()
                );

                videoElement.srcObject = null;
            }

            if (intervalId) {

                clearInterval(intervalId);

                intervalId = null;
            }
        }


        /* =========================
           SHOW DETECTION OUTPUT
           ========================= */

        function showOutput(data) {

            let screen =
                document.querySelector('.screen');

            let detectedGesture =
                data.detected_gesture;


            if (detectedGesture !== 'Error') {

                if (
                    detectedGesture !==
                    lastDetectedGesture
                ) {

                    detectedWord +=
                        detectedGesture;

                    screen.innerText =
                        detectedWord;

                    lastDetectedGesture =
                        detectedGesture;
                }

            } else if (data.message) {
                console.info(data.message);
            }
        }


        /* =========================
           CLEAR SCREEN
           ========================= */

        function clearScreen() {

            let screen =
                document.querySelector('.screen');

            detectedWord = '';

            lastDetectedGesture = '';

            screen.innerText = '';
        }


        /* =========================
           DELETE LAST LETTER
           ========================= */

        function deleteLastLetter() {

            let screen =
                document.querySelector('.screen');

            detectedWord =
                detectedWord.slice(0, -1);

            screen.innerText =
                detectedWord;
        }


        /* =========================
           ADD SPACE
           ========================= */

        function addSpace() {

            let screen =
                document.querySelector('.screen');

            detectedWord += ' ';

            screen.innerText =
                detectedWord;

            lastDetectedGesture = '';
        }


        /* =========================
           CAPTURE AND SEND FRAME
           ========================= */

        async function captureAndSendFrame() {

            /*
             * Make sure camera is ready
             */

            if (
                !videoElement.videoWidth ||
                !videoElement.videoHeight
            ) {
                return;
            }


            /*
             * Create canvas
             */

            const canvas =
                document.createElement('canvas');

            canvas.width =
                videoElement.videoWidth;

            canvas.height =
                videoElement.videoHeight;


            /*
             * Draw video frame
             */

            const ctx =
                canvas.getContext('2d');

            ctx.drawImage(
                videoElement,
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
             * Convert image to JPEG
             */

            const imageData =
                canvas.toDataURL('image/jpeg');


            /* =========================
               SEND TO DJANGO
               ========================= */

            try {

                let csrfToken =
                    getCookie('csrftoken');


                const response =
                    await fetch(
                        '/api/detect/',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json',

                                'X-CSRFToken':
                                    csrfToken
                            },

                            body: JSON.stringify({
                                image_data:
                                    imageData
                            })
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        'Server responded with error'
                    );
                }


                const data =
                    await response.json();


                /*
                 * Display detected gesture
                 */

                showOutput(data);


                console.log(
                    'Response from server:',
                    data
                );


            } catch (err) {

                console.error(
                    'Error sending frame to server:',
                    err
                );
            }
        }

    </script>


    <!-- =========================
         VENDOR JS
         ========================= -->

    <script src="{% static 'assets/vendor/aos/aos.js' %}"></script>

    <script src="{% static 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>

    <script src="{% static 'assets/vendor/glightbox/js/glightbox.min.js' %}"></script>

    <script src="{% static 'assets/vendor/swiper/swiper-bundle.min.js' %}"></script>

    <script src="{% static 'assets/vendor/php-email-form/validate.js' %}"></script>


    <!-- Main JS -->

    <script src="{% static 'assets/js/main.js' %}"></script>


</body>

</html>
